<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20261008-125">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=20261008-125">
  <link rel="shortcut icon" href="favicon.ico?v=20261008-125">
  <script src="pwa.js?v=20261008-125"></script>
  <title>Gösterge Paneli</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css"

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"

</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">
  <div id="topbar-kap"></div>
  <div id="sidebar-kap"></div>

  <main class="app-main">
    <div class="app-content">
      <div class="container-fluid">

        <!-- Genel Dağılım -->
        <div class="card mb-4">
          <div class="card-header">
            <h6 class="mb-0"><i class="bi bi-pie-chart me-1"></i> Genel Dağılım</h6>
          </div>
          <div class="card-body" id="dagilim-govde">
            <div class="dashboard-distribution-grid">
              <div class="dashboard-distribution-panel dashboard-donut-panel">
                <div class="small text-muted fw-bold text-uppercase dashboard-grafik-baslik">Cinsiyet</div>
                <div class="grafik-donut-wrap">
                  <div class="grafik-donut grafik-donut-bos" id="cinsiyet-donut">
                    <div class="grafik-donut-merkez">
                      <div class="sayi" id="donut-toplam">—</div>
                      <div class="etiket">Öğrenci</div>
                    </div>
                  </div>
                  <div class="grafik-legend">
                    <span><i class="grafik-nokta grafik-nokta-erkek"></i> Erkek <strong id="lg-erkek" class="ms-1">0</strong></span>
                    <span><i class="grafik-nokta grafik-nokta-kiz"></i> Kız <strong id="lg-kiz" class="ms-1">0</strong></span>
                  </div>
                </div>
              </div>
              <div class="dashboard-distribution-panel dashboard-class-panel">
                <div class="small text-muted fw-bold text-uppercase dashboard-grafik-baslik">Sınıf Dağılımı</div>
                <div id="sinif-barlar">
                  <div class="text-muted small">—</div>
                </div>
              </div>
              <div class="dashboard-distribution-panel dashboard-donut-panel">
                <div class="small text-muted fw-bold text-uppercase dashboard-grafik-baslik">Yatılılık</div>
                <div class="grafik-donut-wrap">
                  <div class="grafik-donut grafik-donut-bos dashboard-yatililik-donut" id="yatililik-donut">
                    <div class="grafik-donut-merkez">
                      <div class="sayi" id="yatililik-toplam">—</div>
                      <div class="etiket">Yatılı</div>
                    </div>
                  </div>
                  <div class="grafik-legend dashboard-yatililik-legend" id="yatililik-legend"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-lg-6">
            <div class="card h-100">
              <div class="card-header">
                <h6 class="mb-0"><i class="bi bi-cake2 me-1"></i> Doğum Günleri</h6>
              </div>
              <div class="card-body p-0">
                <ul class="list-group list-group-flush" id="dogumgunu-liste" aria-live="polite">
                  <li class="list-group-item text-muted text-center py-4">Hazırlanıyor...</li>
                </ul>
              </div>
            </div>
          </div>
          <div class="col-12 col-lg-6">
            <div class="card h-100">
              <div class="card-header">
                <h6 class="mb-0"><i class="bi bi-star-half me-1"></i> Son Davranış Kayıtları</h6>
              </div>
              <div class="card-body p-0">
                <ul class="list-group list-group-flush" id="davranis-liste" aria-live="polite">
                  <li class="list-group-item text-muted text-center">Veriler hazırlanıyor...</li>
                </ul>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>
<div id="footer-kap"></div>
<div id="bottom-nav-kap"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"
        integrity="sha384-+4p7LDsv7qv4DpdBj3wITizBeFFK5pEwCMHKkmWRepY1L4SzbJD1DKvVWOlFvqMQ"
        crossorigin="anonymous"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// Yerel betikleri tek tek ve hata olursa yeniden deneyerek yükler (zayıf yerel sunucularda kopan isteklere karşı).
window.__yuklenemeyenler = [];
window.OBSHazir = (function () {
  var liste = ["version.js?v=20261008-125", "firebase-imports.js?v=20261008-125", "firebase-config.js?v=20261008-125", "utils.js?v=20261008-125", "school-settings.js?v=20261008-125", "students.js?v=20261008-125", "auth.js?v=20261008-125", "layout.js?v=20261008-125"];
  var bekleyen = [], bitti = false;
  function yukle(i, deneme) {
    if (i >= liste.length) { bitti = true; bekleyen.forEach(function (f) { f(); }); return; }
    var s = document.createElement("script");
    s.src = liste[i] + (deneme ? "&r=" + deneme : "");
    s.onload = function () { yukle(i + 1, 0); };
    s.onerror = function () {
      if (s.parentNode) s.parentNode.removeChild(s);
      if (deneme < 4) { setTimeout(function () { yukle(i, deneme + 1); }, 250 * (deneme + 1)); }
      else { window.__yuklenemeyenler.push(liste[i]); yukle(i + 1, 0); }
    };
    document.head.appendChild(s);
  }
  yukle(0, 0);
  return function (fn) { if (bitti) { fn(); } else { bekleyen.push(fn); } };
})();
</script>
<script>
OBSHazir(async () => {
"use strict";
const { requireAuth, layoutYukle, tumOgrencileriGetir, tumDavranislariGetir, compareSinif, compareOgrenciNo, compareTarihDesc, toast, escapeHtml, escapeAttr, APP_VERSION } = window.OBS;

  const DASHBOARD_CACHE_KEY = `obs-dashboard-cache-v6:${APP_VERSION}`;
  const DASHBOARD_CACHE_TTL = 5 * 60 * 1000;

  requireAuth(async () => {
    layoutYukle();
    await yukleVeriler();
  });

  async function yukleVeriler() {
    const cacheUygulandi = dashboardCacheUygula(dashboardCacheOku());

    try {
      const ogrenciler = await tumOgrencileriGetir();
      const ozet = ogrenciOzetHazirla(ogrenciler);
      dagilimGoster(ozet, ozet.ogrenciler);
      dogumGunleriGoster(ozet.ogrenciler);

      const davranislar = await tumDavranislariGetir();
      yukleSonDavranislar(ozet.ogrenciler, davranislar);
      dashboardCacheYaz();
    } catch (err) {
      if (!cacheUygulandi) dashboardBosDurum(err.message);
      else toast("Güncel veriler alınamadı, son kaydedilen görünüm gösteriliyor.", "warning");
    }
  }

  function ogrenciOzetHazirla(ogrencilerKaynak) {
    let toplam = 0, kiz = 0, erkek = 0, gunduzlu = 0, parali = 0, parasiz = 0;
    const ogrenciler = [];

    ogrencilerKaynak.forEach(kayit => {
      const o = { ...kayit };
      toplam++;
      if (o.cinsiyet === "Kız") kiz++;
      if (o.cinsiyet === "Erkek") erkek++;
      if (o.yatililik === "Paralı Yatılı") parali++;
      else if (o.yatililik === "Parasız Yatılı") parasiz++;
      else gunduzlu++;
      ogrenciler.push(o);
    });
    ogrenciler.sort((a, b) => compareSinif(a.sinif, b.sinif) || compareOgrenciNo(a, b));
    return { toplam, kiz, erkek, gunduzlu, parali, parasiz, ogrenciler };
  }

  function setText(id, v) {
    const el = document.getElementById(id);
    if (el) el.textContent = v;
  }

  function dagilimGoster(sayilar, ogrenciler) {
    const { toplam = 0, kiz = 0, erkek = 0, gunduzlu = 0, parali = 0, parasiz = 0 } = sayilar || {};
    const toplamCinsiyet = (kiz + erkek) || 1;
    const kizYuzde = Math.round((kiz / toplamCinsiyet) * 100);
    const donut = document.getElementById("cinsiyet-donut");
    if (donut) donut.style.background =
      `conic-gradient(var(--obs-chart-girl) 0 ${kizYuzde}%, var(--obs-chart-boy) ${kizYuzde}% 100%)`;
    setText("donut-toplam", toplam);
    setText("lg-erkek", erkek);
    setText("lg-kiz", kiz);

    const yatililikDonut = document.getElementById("yatililik-donut");
    const toplamYatililik = parali + parasiz;
    const legEl = document.getElementById("yatililik-legend");
    const segmentler = [
      { ad: "Parasız", deger: parasiz, sinif: "grafik-nokta-success",   renk: "var(--obs-success)" },
      { ad: "Paralı",  deger: parali,  sinif: "grafik-nokta-secondary", renk: "var(--obs-secondary)" }
    ];
    if (yatililikDonut) {
      yatililikDonut.style.background = toplamYatililik
        ? donutGradient(segmentler)
        : "conic-gradient(var(--obs-border) 0 100%)";
    }
    setText("yatililik-toplam", toplamYatililik);
    if (legEl) legEl.innerHTML = segmentler.map(s => `
      <span>
        <i class="grafik-nokta ${s.sinif}"></i>${s.ad}
        <strong class="ms-1">${s.deger}</strong>
      </span>`).join("");

    const barEl = document.getElementById("sinif-barlar");
    if (!barEl) return;
    const sayim = new Map();
    (ogrenciler || []).forEach(o => {
      const s = o.sinif || "—";
      const mevcut = sayim.get(s) || { erkek: 0, kiz: 0 };
      if (o.cinsiyet === "Erkek") mevcut.erkek++;
      else if (o.cinsiyet === "Kız") mevcut.kiz++;
      sayim.set(s, mevcut);
    });
    const girisler = [...sayim.entries()].sort((a, b) => compareSinif(a[0], b[0]));
    const enYuksek = Math.max(1, ...girisler.map(([, s]) => s.erkek + s.kiz));
    const CHART_H = 120;
    barEl.innerHTML = girisler.length
      ? `<div class="sinif-barlar-kap">
          ${girisler.map(([sinif, s]) => {
            const toplamS = s.erkek + s.kiz;
            const erkekH = Math.round((s.erkek / enYuksek) * CHART_H);
            const kizH = Math.round((s.kiz / enYuksek) * CHART_H);
            return `
            <div class="sinif-bar-kolon">
              <span class="sinif-bar-toplam">${toplamS}</span>
              <div class="sinif-bar-yigin">
                ${s.erkek > 0 ? `<div title="Erkek: ${s.erkek}" class="sinif-bar-parca sinif-bar-parca-erkek" data-height="${erkekH}">
                  ${erkekH >= 16 ? `<span class="sinif-bar-deger">${s.erkek}</span>` : ""}
                </div>` : ""}
                ${s.kiz > 0 ? `<div title="Kız: ${s.kiz}" class="sinif-bar-parca sinif-bar-parca-kiz ${s.erkek === 0 ? "sinif-bar-parca-tek" : ""}" data-height="${kizH}">
                  ${kizH >= 16 ? `<span class="sinif-bar-deger">${s.kiz}</span>` : ""}
                </div>` : ""}
              </div>
              <span class="sinif-bar-etiket">${escapeHtml(sinif)}</span>
            </div>`;
          }).join("")}
        </div>`
      : `<div class="text-muted small">Kayıt yok</div>`;
    barEl.querySelectorAll(".sinif-bar-parca[data-height]").forEach(parca => {
      const height = Math.max(0, Math.min(CHART_H, Number(parca.dataset.height) || 0));
      parca.style.height = `${height}px`;
    });
  }

  function donutGradient(segmentler) {
    const toplam = segmentler.reduce((sum, s) => sum + Math.max(0, Number(s.deger) || 0), 0);
    if (!toplam) return "conic-gradient(var(--obs-border) 0 100%)";

    let baslangic = 0;
    const parcalar = segmentler
      .filter(s => s.deger > 0)
      .map(s => {
        const bitis = baslangic + (s.deger / toplam) * 100;
        const parca = `${s.renk} ${baslangic.toFixed(2)}% ${bitis.toFixed(2)}%`;
        baslangic = bitis;
        return parca;
      });
    return `conic-gradient(${parcalar.join(", ")})`;
  }

  function dogumGunleriGoster(ogrenciler) {
    const liste = document.getElementById("dogumgunu-liste");
    if (!liste) return;
    const bugunD = new Date();
    bugunD.setHours(0, 0, 0, 0);
    const bugunGun = bugunD.getDate();
    const bugunAy = bugunD.getMonth() + 1;
    const sonuc = [];
    (ogrenciler || []).forEach(o => {
      const m = String(o.dogum_tarihi || "").trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
      if (!m) return;
      const g = Number(m[1]), a = Number(m[2]), y = Number(m[3]);
      if (g !== bugunGun || a !== bugunAy) return;
      const yas = bugunD.getFullYear() - y;
      sonuc.push({
        o,
        tarih: `${String(g).padStart(2, "0")}.${String(a).padStart(2, "0")}`,
        yas
      });
    });
    sonuc.sort((a, b) => compareOgrenciNo(a.o, b.o));
    liste.innerHTML = sonuc.length
      ? sonuc.map(s => `
        <li class="list-group-item d-flex align-items-center justify-content-between">
          <a href="students-detail.html?id=${escapeAttr(s.o.id)}" class="text-decoration-none">
            <span class="fw-semibold">${escapeHtml(`${s.o.ad || ""} ${s.o.soyad || ""}`.trim())}</span>
            <span class="text-muted small ms-1">${escapeHtml(s.o.sinif || "")}</span>
          </a>
          <span class="text-end">
            <span class="badge bg-secondary">Bugün</span>
            <div class="small text-muted">${s.tarih}${s.yas > 0 ? ` · ${s.yas} yaş` : ""}</div>
          </span>
        </li>`).join("")
      : `<li class="list-group-item text-muted text-center py-4"><i class="bi bi-cake2 d-block fs-3 mb-2 obs-icon-secondary"></i>Bugün doğum günü yok</li>`;
  }

  function dashboardCacheOku() {
    try {
      const raw = sessionStorage.getItem(DASHBOARD_CACHE_KEY);
      if (!raw) return null;
      const cache = JSON.parse(raw);
      if (!cache?.zaman || Date.now() - cache.zaman > DASHBOARD_CACHE_TTL) return null;
      return cache;
    } catch {
      return null;
    }
  }

  function dashboardCacheUygula(cache) {
    if (!cache) return false;
    if (cache.dagilimHtml) document.getElementById("dagilim-govde").innerHTML = cache.dagilimHtml;
    if (cache.dogumGunuHtml) document.getElementById("dogumgunu-liste").innerHTML = cache.dogumGunuHtml;
    if (cache.davranisHtml) document.getElementById("davranis-liste").innerHTML = cache.davranisHtml;
    return true;
  }

  function dashboardCacheYaz() {
    try {
      sessionStorage.setItem(DASHBOARD_CACHE_KEY, JSON.stringify({
        zaman: Date.now(),
        dagilimHtml: document.getElementById("dagilim-govde").innerHTML,
        dogumGunuHtml: document.getElementById("dogumgunu-liste").innerHTML,
        davranisHtml: document.getElementById("davranis-liste").innerHTML
      }));
    } catch {
      // Tarayıcı depolaması doluysa yalnızca anlık ekranla devam edilir.
    }
  }

  function dashboardBosDurum(mesaj) {
    document.getElementById("dogumgunu-liste").innerHTML =
      `<li class="list-group-item text-muted text-center py-4">${escapeHtml(mesaj || "Veri bulunamadı.")}</li>`;
    document.getElementById("davranis-liste").innerHTML =
      `<li class="list-group-item text-muted text-center">Kayıt yok</li>`;
  }

  function yukleSonDavranislar(ogrenciler, davranislar) {
    const liste = document.getElementById("davranis-liste");
    const ogrById = new Map(ogrenciler.map(ogr => [ogr.id, ogr]));
    const tumDavranislar = davranislar
      .filter(d => ogrById.has(d.ogrenciId))
      .map(d => {
        const ogr = ogrById.get(d.ogrenciId);
        return { ...d, ogrAd: `${ogr.ad || ""} ${ogr.soyad || ""}`.trim(), ogrId: ogr.id };
      })
      .sort((a, b) => compareTarihDesc(a.tarih, b.tarih));
    const son5 = tumDavranislar.slice(0, 5);

    if (son5.length === 0) {
      liste.innerHTML = `<li class="list-group-item text-muted text-center">Kayıt yok</li>`;
      return;
    }

    liste.innerHTML = son5.map(d => {
      const renk = d.tur === "Olumlu" ? "success" : "danger";
      const ikon = d.tur === "Olumlu" ? "bi-stars" : "bi-exclamation-octagon";
      return `<li class="list-group-item px-3 py-2">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <i class="bi ${ikon} text-${renk} me-1"></i>
            <small class="fw-semibold">${escapeHtml(d.ogrAd)}</small>
            <div class="text-muted davranis-kategori-mini">${escapeHtml(d.kategori || "")}</div>
          </div>
          <small class="text-muted">${escapeHtml(d.tarih || "")}</small>
        </div>
      </li>`;
    }).join("");
  }
});
</script>
</body>
</html>
